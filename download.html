    .shot {

    .store {

    .store:active { transform: scale(0.98); }
    .store svg { width: 24px; height: 24px; flex: none; }
    .store small { display: block; font-size: 11px; font-weight: 500; opacity: 0.8; text-align: left; }

    .note { color: var(--muted); font-size: 13px; }

    @media (min-width: 700px) {

    .social { display: flex; justify-content: center; gap: 6px; list-style: none; margin: 4px 0 0; padding: 0; }
    .social a { display: grid; place-items: center; width: 44px; height: 44px; color: var(--muted); border-radius: 50%; }
    .social a:hover, .social a:focus-visible { color: var(--cream); background: var(--card); }

  <script>
    // Sends the visitor to their phone's store. Skipped with ?stay (to
    // preview the page), for a store that is not live yet, and
    // after one redirect in this tab so Back does not bounce.
    (function () {
      'use strict';
      var ua = navigator.userAgent;
      var mine = /Android/i.test(ua) ? 'google'
        : /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'apple'
        : null;
      // Set to true the day the iPhone app is on the App Store (js/main.js too).
      var APP_STORE_LIVE = false;
      var target = null;
      document.querySelectorAll('[data-store]').forEach(function (link) {
        var ready = link.dataset.store !== 'apple' || APP_STORE_LIVE;
        if (!ready) {
          link.classList.add('is-soon');
          link.setAttribute('aria-disabled', 'true');
          link.removeAttribute('href');
        }
        if (link.dataset.store === mine && ready) {
          link.classList.add('is-mine');
          target = link.href;
        }
      });
      if (!target || /[?&]stay\b/.test(location.search)) return;
      var key = 'bc-download-redirected';
      try {
        if (sessionStorage.getItem(key)) return;
        sessionStorage.setItem(key, '1');
      } catch (e) { /* storage blocked: redirect anyway */ }
      location.replace(target);
    })();
  </script>
