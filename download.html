  <!-- Share preview: this page is the link people send around. -->

  <meta property="og:title" content="Get Beginner Cam – take better photos today">
  <meta property="og:description" content="Free composition camera for iPhone and Android. Live guides, film-inspired looks, video and Dual.">

  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/favicon-96.png" sizes="96x96" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    /* One screen, no scrolling: the shot takes whatever height is left. */
    :root {
      --navy: #121a2e;
      --navy-2: #0b1020;
      --cream: #f6f1e7;
      --muted: #a9b0c2;
      --gold: #f2b54b;
      --card: rgba(255, 255, 255, 0.07);
      --edge: rgba(255, 255, 255, 0.14);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--cream);
      -webkit-font-smoothing: antialiased;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(120% 70% at 50% 0%, #1f2a48 0%, var(--navy) 45%, var(--navy-2) 100%);
      background-color: var(--navy);
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }
    h1, p { margin: 0; }

    .page {
      height: 100vh;
      height: 100dvh;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 2.2vh, 22px);
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      text-align: center;
    }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
    .brand img { width: 34px; height: 34px; border-radius: 9px; }

    h1 {
      font-size: clamp(28px, 4.6vh, 44px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    h1 em { font-style: normal; color: var(--gold); }
    .sub { margin-top: 6px; color: var(--muted); font-size: clamp(14px, 1.9vh, 17px); line-height: 1.35; }

    /* The screenshot shrinks to fit the screen height. */
    .shot {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .shot__phone {
      height: 100%;
      aspect-ratio: 600 / 1304;
      max-width: 100%;
      padding: 6px;
      border-radius: 34px;
      background: #05070d;
      border: 1px solid var(--edge);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .shot__phone img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 28px; }

    .buttons { width: 100%; display: flex; flex-direction: column; gap: 10px; }
    .store {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      height: 58px; border-radius: 16px;
      background: var(--card); border: 1px solid var(--edge);
      font-weight: 700; font-size: 17px;
      transition: transform 0.2s, background 0.2s;
    }
    .store:active { transform: scale(0.98); }
    .store svg { width: 24px; height: 24px; flex: none; }
    .store small { display: block; font-size: 11px; font-weight: 500; opacity: 0.8; text-align: left; }
    .store span { text-align: left; line-height: 1.1; }
    /* The visitor's own store: filled and first. */
    .store.is-mine { background: var(--cream); color: var(--navy); border-color: var(--cream); order: -1; }
    .store.is-soon { opacity: 0.5; pointer-events: none; }
    .store.is-soon small::after { content: " · soon"; }

    .note { color: var(--muted); font-size: 13px; }
    .note a { text-decoration: underline; text-underline-offset: 2px; }

    @media (min-width: 700px) {
      .buttons { flex-direction: row; }
      .store { flex: 1; }
      .store.is-mine { order: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .store { transition: none; } }
  </style>
</head>
<body>
  <main class="page">
    <a class="brand" href="/" aria-label="Beginner Cam website">
      <img src="/assets/icon.webp" alt="" width="34" height="34">
      <span>Beginner Cam</span>
    </a>

    <header>
      <h1>Take better photos <em>today.</em></h1>
      <p class="sub">A live guide on your camera, film-inspired looks, video and Dual.</p>
    </header>

    <div class="shot">
      <div class="shot__phone">
        <img src="/assets/screens/camera.jpg" alt="The Beginner Cam camera with a Frame in frame guide: a woman framed by a stone window over the city at sunset" width="600" height="1304" fetchpriority="high">
      </div>
    </div>

    <div class="buttons">
      <!-- Set the real App Store link (YOUR_APP_ID) when iOS is live; until then the button shows "soon" and iPhones are not redirected. -->
      <a class="store" data-store="apple" href="https://apps.apple.com/app/idYOUR_APP_ID">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
        <span><small>Download on the</small>App Store</span>
      </a>
      <a class="store" data-store="google" href="https://play.google.com/store/apps/details?id=com.reach.beginnercamera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
        <span><small>Get it on</small>Google Play</span>
      </a>
    </div>

    <p class="note">Free · No account · No subscription · <a href="/">More</a></p>
  </main>

  <script>
    // Sends the visitor to their phone's store. Skipped with ?stay (to
    // preview the page), for a store link that is still a placeholder, and
    // after one redirect in this tab so Back does not bounce.
    (function () {
      'use strict';
      var ua = navigator.userAgent;
      var mine = /Android/i.test(ua) ? 'google'
        : /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'apple'
        : null;
      var target = null;
      document.querySelectorAll('[data-store]').forEach(function (link) {
        var ready = link.getAttribute('href').indexOf('YOUR_') === -1;
        if (!ready) {
          link.classList.add('is-soon');
          link.setAttribute('aria-disabled', 'true');
          link.removeAttribute('href');
        }
        if (link.dataset.store === mine && ready) {
          link.classList.add('is-mine');
          target = link.href;
        }
      });
      if (!target || /[?&]stay\b/.test(location.search)) return;
      var key = 'bc-download-redirected';
      try {
        if (sessionStorage.getItem(key)) return;
        sessionStorage.setItem(key, '1');
      } catch (e) { /* storage blocked: redirect anyway */ }
      location.replace(target);
    })();
  </script>
</body>
</html>
