<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Beginner Cam">
  <!-- The Beginner Cam mark: a rule of thirds grid with the subject (gold)
       on a crossing. Same artwork as the app icon. -->
  <rect width="64" height="64" rx="15" fill="#141414"/>
  <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9">
    <line x1="23.5" y1="13" x2="23.5" y2="51"/>
    <line x1="40.5" y1="13" x2="40.5" y2="51"/>
    <line x1="13" y1="23.5" x2="51" y2="23.5"/>
    <line x1="13" y1="40.5" x2="51" y2="40.5"/>
  </g>
  <circle cx="40.5" cy="23.5" r="5.5" fill="#E3B866"/>
</svg>
